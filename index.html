<body><aside class="sidebar"><a class="brand" href="#dashboard"><span class="brand-icon">A</span><span>Artery<small>販売・在庫管理</small></span></a><div class="nav-label">WORKSPACE</div><nav id="nav" role="tablist" aria-label="メインタブ"></nav><div class="sidebar-bottom"><span class="avatar">お</span><div>おっかのワークスペース<small>販売管理アプリ v1.0</small></div></div></aside>

<dialog id="modal"><form id="modalForm"><div class="modal-head"><h2 id="modalTitle"></h2><button type="button" data-act="close" class="icon-btn" aria-label="閉じる">×</button></div><div id="modalBody" class="modal-body"></div><div class="modal-foot"><button type="button" data-act="close" class="btn">閉じる</button><button id="modalSave" class="btn primary" type="submit">保存する</button></div></form></dialog><div id="toast" role="status" aria-live="polite"></div><input type="file" id="jsonFile" accept=".json,application/json" hidden><input type="file" id="csvFile" accept=".csv,.tsv,text/csv" hidden>
<script>(function(root){
'use strict';
const clone=x=>JSON.parse(JSON.stringify(x));
const id=(prefix='id')=>prefix+'_'+(globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2));
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function assert(ok,msg){if(!ok)throw Error(msg);}
function num(n,label,integer=true){assert(typeof n==='number'&&Number.isFinite(n)&&n>=0&&(!integer||Number.isSafeInteger(n)),label+'を正しい数値で入力してください');return n;}
function date(s){assert(/^\d{4}-\d{2}-\d{2}$/.test(s)&&!Number.isNaN(Date.parse(s))&&new Date(s).toISOString().slice(0,10)===s,'日付を確認してください');return s;}
function blank(){return {schema:1,appId:'okka-red-sales',products:[],skus:[],units:[],channels:[],shippings:[],prices:{},purchases:[],imports:[],arrivals:[],orders:[],audit:[]};}
function allocate(total,weights){num(total,'配分金額');const sum=weights.reduce((a,b)=>a+num(b,'配分基準',false),0);if(!sum){assert(total===0,'商品代金が0円のため共通費を配分できません');return weights.map(()=>0);}const raw=weights.map(w=>total*w/sum),out=raw.map(Math.floor);let remain=total-out.reduce((a,b)=>a+b,0);const order=raw.map((v,i)=>({i,r:v-out[i]})).sort((a,b)=>b.r-a.r||a.i-b.i);for(let j=0;j<remain;j++)out[order[j%order.length].i]++;return out;}
function fees(x){return (x.expenses||[]).reduce((n,f)=>n+f.amount,0);}
function lookup(d,kind,key){return d[kind].find(x=>x.id===key);}
function lineIndex(d){return new Map(d.purchases.flatMap(p=>p.lines.map(l=>[l.id,{...l,purchase:p}])));}
function used(d,lotId){return d.orders.filter(o=>!o.cancelled).flatMap(o=>o.lines.flatMap(l=>l.parts.flatMap(p=>p.consumed))).filter(c=>c.lotId===lotId);}
function freeRanges(qty,segments){const ranges=[];let cursor=0;for(const s of [...segments].sort((a,b)=>a.from-b.from)){assert(s.from>=cursor,'在庫の消費範囲が重複しています');if(s.from>cursor)ranges.push({from:cursor,qty:s.from-cursor});cursor=s.from+s.qty;}assert(cursor<=qty,'在庫数を超える出荷があります');if(cursor<qty)ranges.push({from:cursor,qty:qty-cursor});return ranges;}
function lots(d,asOf='9999-12-31'){
 const idx=lineIndex(d),purchaseExtra=new Map(),costParts=new Map();
 for(const p of d.purchases){const ex=p.lines.map(()=>0);for(const f of p.expenses){allocate(f.amount,p.lines.map(l=>l.price*l.qty)).forEach((n,i)=>ex[i]+=n);}p.lines.forEach((l,i)=>purchaseExtra.set(l.id,ex[i]));}
 for(const [lineId,l] of idx){const slices=d.imports.flatMap(b=>b.allocations.filter(a=>a.lineId===lineId));const assigned=slices.reduce((n,a)=>n+a.qty,0);assert(assigned<=l.qty,'輸入便への割当数量が仕入数を超えています');const extra=allocate(purchaseExtra.get(lineId)||0,[...slices.map(a=>a.qty),l.qty-assigned]);slices.forEach((a,i)=>costParts.set(a.id,l.price*a.qty+extra[i]));}
 const out=[];
 for(const batch of d.imports){const extras=batch.allocations.map(()=>0),weights=batch.allocations.map(a=>{const l=idx.get(a.lineId);assert(l,'仕入明細が見つかりません');return l.price*a.qty;});for(const f of batch.expenses)allocate(f.amount,weights).forEach((n,i)=>extras[i]+=n);
 batch.allocations.forEach((a,i)=>{const l=idx.get(a.lineId);const arrived=d.arrivals.filter(r=>r.lotId===a.id&&r.date<=asOf).reduce((n,r)=>n+r.qty,0),consumed=used(d,a.id),sold=consumed.reduce((n,c)=>n+c.qty,0),totalCost=num(costParts.get(a.id)+extras[i],'ロット原価');out.push({id:a.id,position:out.length,skuId:l.skuId,lineId:a.lineId,purchaseId:l.purchase.id,importId:batch.id,date:l.purchase.date,created:l.purchase.created||'',qty:a.qty,arrived,sold,available:arrived-sold,totalCost,unitCost:totalCost/a.qty,finalized:batch.finalized,pending:a.qty-arrived,consumed});});}
 return out.sort((a,b)=>a.date.localeCompare(b.date)||a.created.localeCompare(b.created)||a.position-b.position);
}
function rangeCost(lot,c){return Math.floor(lot.totalCost*(c.from+c.qty)/lot.qty)-Math.floor(lot.totalCost*c.from/lot.qty);}
function stock(d,skuId){return lots(d).filter(l=>l.skuId===skuId).reduce((n,l)=>n+l.available,0);}
function unitAvailable(d,unit){return Math.min(...unit.components.map(c=>Math.floor(stock(d,c.skuId)/c.qty)));}
function priceKey(unitId,channelId){return unitId+'|'+channelId;}
function priceOf(d,unitId,channelId){return d.prices[priceKey(unitId,channelId)]||{normal:0,sale:0,shippingId:''};}
function addSku(d,{productName,code,label='',referencePrice=0,shippingId=''}){assert(productName.trim()&&code.trim(),'商品名とSKUコードを入力してください');assert(!d.skus.some(s=>s.code.toLowerCase()===code.trim().toLowerCase()),'SKUコードが重複しています');let p=d.products.find(p=>p.name===productName.trim());if(!p){p={id:id('p'),name:productName.trim()};d.products.push(p);}const s={id:id('s'),productId:p.id,code:code.trim(),label:label.trim(),referencePrice:num(referencePrice,'配分基準額'),shippingId};d.skus.push(s);d.units.push({id:id('u'),code:s.code,name:p.name+(s.label?' / '+s.label:''),components:[{skuId:s.id,qty:1}],parcels:1,single:true});return s;}
function addUnit(d,{code,name,components,parcels=1}){assert(code.trim()&&name.trim(),'販売コードと名称を入力してください');assert(!d.units.some(u=>u.code.toLowerCase()===code.trim().toLowerCase()),'販売コードが重複しています');assert(components.length,'構成SKUを追加してください');const combined=new Map();for(const c of components){assert(lookup(d,'skus',c.skuId),'SKUを選択してください');num(c.qty,'構成数量');assert(c.qty>0,'構成数量は1以上です');combined.set(c.skuId,(combined.get(c.skuId)||0)+c.qty);}num(parcels,'標準発送件数');assert(parcels>0,'標準発送件数は1以上です');const u={id:id('u'),code:code.trim(),name:name.trim(),components:[...combined].map(([skuId,qty])=>({skuId,qty})),parcels,single:false};d.units.push(u);return u;}
function addPurchase(d,{purchaseId,date:dt=today(),memo='',lines,expenses=[],autoImport=true}){date(dt);assert(lines.length,'仕入明細を入力してください');const rec={id:purchaseId||id('buy'),date:dt,created:new Date().toISOString(),memo,lines:lines.map(l=>{assert(lookup(d,'skus',l.skuId),'SKUを選択してください');num(l.qty,'仕入数');assert(l.qty>0,'仕入数は1以上です');return {id:id('line'),skuId:l.skuId,qty:l.qty,price:num(l.price,'仕入単価')};}),expenses:expenses.map(f=>({id:id('fee'),name:f.name||'仕入共通費',amount:num(f.amount,'共通費')}))};assert(!d.purchases.some(p=>p.id===rec.id),'仕入IDが重複しています');d.purchases.push(rec);if(autoImport)addImport(d,{name:dt+' 仕入便',allocations:rec.lines.map(l=>({lineId:l.id,qty:l.qty}))});lots(d);return rec;}
function addImport(d,{name,date:dt=today(),allocations,expenses=[]}){assert(name.trim()&&allocations.length,'便名と対象明細を入力してください');date(dt);const idx=lineIndex(d);for(const a of allocations){const l=idx.get(a.lineId);assert(l,'仕入明細が見つかりません');num(a.qty,'割当数');assert(a.qty>0,'割当数は1以上です');const assigned=d.imports.flatMap(b=>b.allocations).filter(x=>x.lineId===a.lineId).reduce((n,x)=>n+x.qty,0);assert(assigned+a.qty<=l.qty,'仕入数を超えて輸入便に割り当てられません');}assert(new Set(allocations.map(a=>a.lineId)).size===allocations.length,'同じ明細は1行にまとめてください');const batch={id:id('imp'),name:name.trim(),date:dt,allocations:allocations.map(a=>({id:id('lot'),lineId:a.lineId,qty:a.qty})),expenses:expenses.map(f=>({id:id('fee'),name:f.name||'輸入共通費',amount:num(f.amount,'共通費')})),finalized:false};d.imports.push(batch);lots(d);return batch;}
function mergeImports(d,ids,name){assert(ids.length>=2,'まとめる輸入便を2件以上選択してください');const selected=d.imports.filter(b=>ids.includes(b.id));assert(selected.length===ids.length,'輸入便が見つかりません');assert(selected.every(b=>!b.finalized),'確定済み便は原価を未確定に戻してからまとめてください');const merged={id:id('imp'),name:name.trim()||'まとめ輸入便',date:selected.map(b=>b.date).sort()[0],allocations:selected.flatMap(b=>b.allocations),expenses:selected.flatMap(b=>b.expenses),finalized:false};d.imports=d.imports.filter(b=>!ids.includes(b.id));d.imports.push(merged);lots(d);return merged;}
function addArrival(d,{lotId,qty,date:dt=today()}){date(dt);num(qty,'到着数');const lot=lots(d).find(l=>l.id===lotId);assert(lot&&qty>0&&qty<=lot.pending,'到着数を確認してください');assert(dt>=lot.date,'到着日は仕入日以降にしてください');d.arrivals.push({id:id('arr'),lotId,qty,date:dt});}
function expenseImpact(d,importId,expense){const before=metrics(d),next=clone(d),batch=lookup(next,'imports',importId);assert(batch,'輸入便が見つかりません');assert(!batch.finalized,'確定済みです。未確定に戻してから追加してください');num(expense.amount,'共通費');batch.expenses.push({id:id('fee'),name:expense.name||'後日費用',amount:expense.amount,date:expense.date||today()});const after=metrics(next);return {next,inventory:after.inventory-before.inventory,cogs:after.cogs-before.cogs,profit:after.profit-before.profit};}
function makeOrder(d,input){
 const dt=date(input.date||today()),ch=lookup(d,'channels',input.channelId);assert(ch,'販路を選択してください');assert(input.lines.length,'出荷明細を入力してください');assert(['separate','shared'].includes(input.mode),'発送区分を確認してください');const allLots=lots(d,dt),reserved=new Map(),rows=[];
 for(const row of input.lines){const unit=lookup(d,'units',row.unitId);assert(unit,'販売単位を選択してください');num(row.qty,'販売数');assert(row.qty>0,'販売数は1以上です');num(row.price,'販売単価');const revenue=row.qty*row.price;num(revenue,'売上金額');const parts=[];
 for(const comp of unit.components){let remaining=comp.qty*row.qty;const consumed=[];for(const lot of allLots.filter(l=>l.skuId===comp.skuId&&l.date<=dt)){const free=freeRanges(lot.arrived,[...lot.consumed,...(reserved.get(lot.id)||[])]);for(const r of free){if(!remaining)break;const take=Math.min(remaining,r.qty),c={lotId:lot.id,from:r.from,qty:take};consumed.push(c);reserved.set(lot.id,[...(reserved.get(lot.id)||[]),c]);remaining-=take;}if(!remaining)break;}const sku=lookup(d,'skus',comp.skuId);assert(!remaining,(sku?.code||'SKU')+' の在庫が不足しています（出荷日までの到着数を確認）');parts.push({skuId:comp.skuId,skuCode:sku.code,name:(lookup(d,'products',sku.productId)?.name||'')+(sku.label?' / '+sku.label:''),qty:comp.qty*row.qty,consumed});}
 const refs=unit.components.map(c=>(lookup(d,'skus',c.skuId)?.referencePrice||0)*c.qty);if(unit.components.length>1)assert(refs.every(v=>v>0),'セット構成SKUの「売上配分基準額」を商品マスタに登録してください');const skuRevenues=allocate(revenue,unit.components.length===1?[1]:refs);parts.forEach((p,i)=>p.revenue=skuRevenues[i]);const ship=lookup(d,'shippings',row.shippingId),parcels=num(row.parcels??row.qty*(unit.parcels||1),'発送件数');if(input.mode==='separate')assert(ship&&parcels>0,'送料パターンと発送件数を入力してください');rows.push({id:id('ol'),unitId:unit.id,unitCode:unit.code,name:unit.name,qty:row.qty,price:row.price,priceType:row.priceType||'normal',revenue,shipping:input.mode==='separate'?ship.cost*parcels:0,shippingName:ship?.name||'',shippingMethod:ship?.method||'',parcels:input.mode==='separate'?parcels:0,parts});
 }
 const revenue=rows.reduce((n,r)=>n+r.revenue,0);let shipping=rows.reduce((n,r)=>n+r.shipping,0),parcels=rows.reduce((n,r)=>n+r.parcels,0),shippingName='',shippingMethod='';if(input.mode==='shared'){const sp=lookup(d,'shippings',input.shippingId);assert(sp,'同梱の送料パターンを選択してください');parcels=num(input.parcels||1,'梱包数');assert(parcels>0,'梱包数は1以上です');shipping=sp.cost*parcels;shippingName=sp.name;shippingMethod=sp.method;}
 if(input.shippingOverride!==undefined)shipping=num(input.shippingOverride,'実送料');const lineWeights=rows.map(r=>r.revenue);const splitWeights=lineWeights.some(Boolean)?lineWeights:rows.map(r=>r.qty);if(input.mode==='shared'||input.shippingOverride!==undefined){allocate(shipping,splitWeights).forEach((n,i)=>rows[i].shipping=n);}
 const transactions=input.mode==='shared'?1:rows.reduce((n,r)=>n+r.qty,0),fee=input.feeOverride===undefined?Math.round(revenue*ch.rate/100)+(ch.fixed||0)*transactions:num(input.feeOverride,'実手数料');allocate(fee,splitWeights).forEach((n,i)=>rows[i].fee=n);for(const row of rows){const w=row.parts.some(p=>p.revenue)?row.parts.map(p=>p.revenue):row.parts.map(p=>p.qty);const fs=allocate(row.fee,w),ss=allocate(row.shipping,w);row.parts.forEach((p,i)=>{p.fee=fs[i];p.shipping=ss[i];});}
 const order={id:input.orderId||id('sale'),created:new Date().toISOString(),date:dt,channelId:ch.id,channelName:ch.name,mode:input.mode,lines:rows,revenue,fee,shipping,parcels,shippingName,shippingMethod,memo:input.memo||'',cancelled:false};assert(!d.orders.some(o=>o.id===order.id),'取引IDが重複しています');d.orders.push(order);return order;
}
function orderResult(d,o,lotMap=new Map(lots(d).map(l=>[l.id,l]))){let cost=0,provisional=false;const rows=o.lines.map(r=>{let rowCost=0;const parts=r.parts.map(p=>{let cogs=0;for(const c of p.consumed){const lot=lotMap.get(c.lotId);assert(lot,'消費した仕入ロットが見つかりません');cogs+=rangeCost(lot,c);if(!lot.finalized)provisional=true;}rowCost+=cogs;return {...p,cogs,profit:p.revenue-cogs-p.fee-p.shipping};});cost+=rowCost;return {...r,parts,cogs:rowCost,profit:r.revenue-rowCost-r.fee-r.shipping};});return {...o,lines:rows,cogs:cost,profit:o.revenue-cost-o.fee-o.shipping,provisional};}
function metrics(d,{month='',channelId=''}={}){const ls=lots(d),map=new Map(ls.map(l=>[l.id,l])),orders=d.orders.filter(o=>!o.cancelled&&(!month||o.date.startsWith(month))&&(!channelId||o.channelId===channelId)).map(o=>orderResult(d,o,map));let inventory=0;for(const l of ls)for(const r of freeRanges(l.arrived,l.consumed))inventory+=rangeCost(l,r);return {orders,revenue:orders.reduce((n,o)=>n+o.revenue,0),cogs:orders.reduce((n,o)=>n+o.cogs,0),profit:orders.reduce((n,o)=>n+o.profit,0),fee:orders.reduce((n,o)=>n+o.fee,0),shipping:orders.reduce((n,o)=>n+o.shipping,0),qty:orders.reduce((n,o)=>n+o.lines.reduce((m,l)=>m+l.qty,0),0),inventory,stock:ls.reduce((n,l)=>n+l.available,0),pending:ls.reduce((n,l)=>n+l.pending,0),provisional:orders.filter(o=>o.provisional).length};}
function ranking(d,{month='',channelId='',axis='product',sort='revenue'}={}){const map=new Map();function add(key,name,values){const old=map.get(key)||{key,name,qty:0,revenue:0,cogs:0,fee:0,shipping:0,profit:0};for(const f of ['qty','revenue','cogs','fee','shipping','profit'])old[f]+=values[f]||0;map.set(key,old);}for(const o of metrics(d,{month,channelId}).orders)for(const l of o.lines){if(axis==='unit')add(l.unitId,l.name,l);else for(const p of l.parts){const s=lookup(d,'skus',p.skuId),product=lookup(d,'products',s.productId);add(axis==='sku'?p.skuId:product.id,axis==='sku'?p.skuCode+' / '+p.name:product.name,p);}}return [...map.values()].sort((a,b)=>b[sort]-a[sort]||a.name.localeCompare(b.name,'ja'));}
function lineMessage(d,order){const rows=order.lines.map(l=>l.name+' ×'+l.qty+(order.mode==='separate'?'［'+l.shippingName+'・'+l.parcels+'件］':''));return '発注依頼\n日付: '+order.date+'\n販路: '+order.channelName+'\n'+(order.mode==='shared'?'発送: '+order.shippingName+'・'+order.parcels+'梱包（同梱）\n':'')+'\n'+rows.join('\n')+(order.memo?'\n\n備考: '+order.memo:'');}

function renderBanner(){let html=mode==='demo'?'<div class="demo-banner"><span><b>サンプルモード</b>　架空のデータで操作を試せます。実データとは別に保存されます。</span>'+btn('サンプルをリセット','reset-demo','','small')+'</div>':'';if(localChanged)html+='<div class="notice danger">別タブで更新がありました。保存前に再読み込みしてください。 '+btn('再読み込み','reload','','small')+'</div>';if(conflict)html+='<div class="notice danger">クラウドとの競合を検知しました。手元の変更を保持しています。設定画面で解決してください。 '+btn('設定へ','go-settings','','small')+'</div>';$('#modeBanner').innerHTML=html;$('#modeToggle').textContent=mode==='demo'?'実データへ切替':'サンプルを確認';$('#syncStatus').textContent=mode==='demo'?'サンプル保存':config.url?(conflict?'同期の確認が必要':config.dirty?'未同期の変更あり':'クラウド接続'):'この端末に保存';$('#syncStatus').className='status '+(conflict?'bad':mode==='real'&&config.url&&!config.dirty?'good':'');}
function render(){
 const opened=$$('#view details[id][open]').map(x=>x.id);
 renderBanner();$('#nav').innerHTML=tabs.map(([id,icon,label])=>'<button data-act="nav" data-id="'+id+'" class="'+(page===id?'active':'')+'" role="tab" aria-selected="'+(page===id)+'"><span class="nav-icon">'+icon+'</span>'+label+'</button>').join('');$('#pageLabel').textContent=tabs.find(t=>t[0]===page)?.[2]||'';
 const views={dashboard,purchase:purchases,arrival:arrivalView,orders:ordersView,inventory:inventoryView,sales:salesView,analysis:analysisView,settings:settingsView};
 try{$('#view').innerHTML=(views[page]||dashboard)();for(const id of opened){const el=document.getElementById(id);if(el?.tagName==='DETAILS')el.open=true;}}catch(e){$('#view').innerHTML='<div class="notice danger">'+esc(e.message)+'</div>';console.error(e);}
}
function monthSeries(){const out=[];const [y,m]=C.today().split('-').map(Number);for(let i=5;i>=0;i--){const dt=new Date(y,m-1-i,1),key=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0'),v=C.metrics(db,{month:key});out.push({month:key,...v});}return out;}
function graph(){const rows=monthSeries(),max=Math.max(1,...rows.map(r=>r.revenue));return '<div class="chart">'+rows.map(r=>'<div class="chart-col"><div class="chart-bars"><div class="bar pale" style="height:'+Math.max(1,r.revenue/max*145)+'px" title="'+r.month+' 売上 '+yen(r.revenue)+'"></div><div class="bar" style="height:'+Math.max(1,Math.max(0,r.profit)/max*145)+'px" title="'+r.month+' 販売利益 '+yen(r.profit)+'"></div></div><div class="chart-label">'+r.month.slice(5)+'月</div></div>').join('')+'</div><div class="legend"><span><i class="pale"></i>売上</span><span><i></i>販売利益</span></div>'+(rows.some(r=>r.profit<0)?'<div class="help-inline">赤字月の利益は棒グラフで0表示。金額は月別表で確認できます。</div>':'');}
function rankTable(rows,limit=1000){return rows.length?table(['順位','商品・販売単位','#販売数','#売上','#販売利益'],rows.slice(0,limit).map((r,i)=>'<tr><td><span class="rank '+(i<3?'top':'')+'">'+(i+1)+'</span></td><td class="text-wrap"><span class="item-name">'+esc(r.name)+'</span></td><td class="num">'+count(r.qty)+'</td><td class="num">'+yen(r.revenue)+'</td><td class="num '+(r.profit<0?'red-text':'green-text')+'">'+yen(r.profit)+'</td></tr>')):empty('まだ販売実績がありません','出荷を登録するとランキングが表示されます。');}
function dashboard(){const m=C.metrics(db,{month}),all=C.metrics(db),ranks=C.ranking(db,{month}),channels=db.channels.map(c=>({...c,...C.metrics(db,{month,channelId:c.id})})),max=Math.max(1,...channels.map(c=>c.revenue));return head('ダッシュボード','仕入れ・在庫・販売の状況を、ひと目で。',btn('＋ 出荷依頼','new-order','','primary'))+'<div class="hero"><div><div class="hero-label">'+month.replace('-','年')+'月 の販売利益</div><div class="hero-value">'+yen(m.profit)+'</div><div class="hero-foot">売上 − 仕入原価 − 販売手数料 − 発送送料'+(m.provisional?'　／ '+m.provisional+'件は原価未確定':'')+'</div></div><div class="hero-side"><div><small>今月の売上</small><strong>'+yen(m.revenue)+'</strong></div><div><small>利益率</small><strong>'+(m.revenue?(m.profit/m.revenue*100).toFixed(1):'0.0')+'<small>%</small></strong></div></div></div>'+kpis([['販売数量',count(m.qty)+' <small>個・セット</small>','今月の出荷実績'],['現在庫',count(all.stock)+' <small>点</small>','SKUの実在庫・到着済み'],['在庫評価額',yen(all.inventory),'販売済み分の原価を除く'],['未到着',count(all.pending)+' <small>点</small>','輸入便に割当済みの数量']])+'<div class="two-cols">'+card('月別の売上・販売利益',graph(),'<span class="muted">直近6か月</span>',true)+card('販路別の売上',channels.length?channels.map(c=>'<div class="bar-row"><span>'+esc(c.name)+'</span><div class="bar-track"><div style="width:'+c.revenue/max*100+'%"></div></div><strong>'+yen(c.revenue)+'</strong></div>').join(''):empty('販路を登録してください'),'<span class="muted">今月</span>',true)+'</div>'+card('今月の商品ランキング',rankTable(ranks,5),btn('すべて見る →','go-analysis','','ghost small'))+card('最近の出荷',ordersTable(C.metrics(db).orders.slice().reverse().slice(0,5)),btn('履歴を見る →','go-orders','','ghost small'));}
function purchaseHistoryView(){const rows=[...db.purchases].reverse().map(p=>'<tr><td>'+esc(p.date)+'</td><td><span class="item-name">'+esc(p.memo||p.id.slice(0,14))+'</span><div class="item-code">'+p.lines.length+' SKU / '+count(p.lines.reduce((n,l)=>n+l.qty,0))+'点</div></td><td class="num">'+yen(p.lines.reduce((n,l)=>n+l.price*l.qty,0))+'</td><td class="num">'+yen(C.fees(p))+'</td><td>'+btn('明細','purchase-detail',p.id,'small')+'</td></tr>');return head('仕入れ管理','商品単価と数量を登録。共通費は商品代金の比率で配分します。',btn('＋ 仕入れを登録','new-purchase','','primary'))+card('仕入れ履歴',rows.length?table(['仕入日','仕入れ','#商品代金','#仕入共通費',''],rows):empty('最初の仕入れを登録しましょう','先に「販売管理」の商品・SKU・セットから登録してください。'));}
function importsView(){const ls=C.lots(db),idx=C.lineIndex(db);return head('輸入便・共通費','複数の仕入れをまとめて管理し、後から届く費用を追加できます。',btn('便をまとめる','merge-imports')+btn('＋ 輸入便を作成','new-import','','primary'))+card('輸入便一覧',db.imports.length?[...db.imports].reverse().map(b=>{const owned=ls.filter(l=>l.importId===b.id),total=owned.reduce((n,l)=>n+l.totalCost,0),arrived=owned.reduce((n,l)=>n+l.arrived,0),q=owned.reduce((n,l)=>n+l.qty,0);return '<div class="batch-row"><div class="batch-top"><div><h3>'+esc(b.name)+' '+tag(b.finalized?'原価確定':'原価未確定',b.finalized?'green':'amber')+'</h3><div class="item-code">'+esc(b.date)+' / '+new Set(owned.map(l=>l.purchaseId)).size+'件の仕入れ</div></div><div class="actions">'+btn('＋ 共通費','add-expense',b.id,'small')+btn(b.finalized?'確定を解除':'原価を確定','finalize',b.id,'small')+'</div></div><div class="batch-info"><span>割当 '+count(q)+'点</span><span>到着 '+count(arrived)+'点</span><span>便の共通費 '+yen(C.fees(b))+'</span><span>原価総額 <b>'+yen(total)+'</b></span></div><details><summary>構成SKU・費用の内訳</summary>'+table(['SKU','#割当数','#到着数','#原価／点','#原価総額'],owned.map(l=>{const s=C.lookup(db,'skus',l.skuId);return '<tr><td>'+esc(s.code)+'<div class="item-code">'+esc(skuName(s))+'</div></td><td class="num">'+l.qty+'</td><td class="num">'+l.arrived+'</td><td class="num">'+yen(l.unitCost)+'</td><td class="num">'+yen(l.totalCost)+'</td></tr>';}))+'<div class="details-body">'+(b.expenses.length?b.expenses.map(f=>'<div class="batch-top"><span>'+esc(f.name)+'</span><span>'+yen(f.amount)+' '+btn('削除','remove-expense',b.id+'|'+f.id,'ghost small')+'</span></div>').join(''):'<span class="muted">便の共通費はまだ登録されていません。</span>')+'<div class="help-inline">単価表示は円単位。内部ではロット総額を保持し、端数も販売原価・在庫額に配分します。</div></div></details></div>';}).join(''):empty('輸入便がありません','仕入れ登録時に自動作成できます。'));}
function arrivalView(){const ls=C.lots(db).filter(l=>l.pending>0);return head('到着登録','届いた数量だけ在庫へ反映。分納にも対応します。')+card('未到着の明細',ls.length?table(['SKU','輸入便','#未到着','#到着済み',''],ls.map(l=>{const s=C.lookup(db,'skus',l.skuId);return '<tr><td><span class="item-name">'+esc(skuName(s))+'</span><div class="item-code">'+esc(s.code)+'</div></td><td>'+esc(C.lookup(db,'imports',l.importId).name)+'</td><td class="num">'+l.pending+'</td><td class="num">'+l.arrived+'</td><td>'+btn('到着を登録','arrive',l.id,'primary small')+'</td></tr>';})):empty('未到着の明細はありません'))+card('到着履歴',db.arrivals.length?table(['到着日','SKU','#数量'],[...db.arrivals].reverse().map(a=>{const l=C.lots(db).find(l=>l.id===a.lotId),s=C.lookup(db,'skus',l.skuId);return '<tr><td>'+esc(a.date)+'</td><td>'+esc(s.code)+' / '+esc(skuName(s))+'</td><td class="num">'+a.qty+'</td></tr>';})):empty('到着履歴はありません'));}
function ordersTable(orders){return orders.length?table(['出荷日','販売内容','販路','#売上','#原価','#送料','#販売利益',''],orders.map(o=>'<tr><td>'+esc(o.date)+'</td><td class="text-wrap"><span class="item-name">'+esc(o.lines.map(l=>l.name+' ×'+l.qty).join('、'))+'</span><div class="item-code">'+(o.cancelled?tag('取消済み'):tag(o.mode==='shared'?'同梱':'個別発送'))+' '+(!o.cancelled&&o.provisional?tag('暫定利益','amber'):'')+'</div></td><td>'+esc(o.channelName)+'</td><td class="num">'+yen(o.revenue)+'</td><td class="num">'+yen(o.cogs)+'</td><td class="num">'+yen(o.shipping)+'</td><td class="num '+(o.profit<0?'red-text':'green-text')+'">'+yen(o.profit)+'</td><td>'+btn('詳細','order-detail',o.id,'small')+'</td></tr>')):empty('出荷履歴はありません','登録すると在庫・売上・利益に反映されます。');}
function ordersView(){const result=[...db.orders].reverse().filter(o=>!filters.month||o.date.startsWith(filters.month)).map(o=>C.orderResult(db,o));return head('発注・出荷管理','単品もセットも、数量から出荷依頼を作成。',btn('表で一括入力','quick-order')+btn('＋ 出荷依頼','new-order','','primary'))+'<div class="filter-bar">'+field('表示月',input('orderMonth',filters.month,'month'))+'</div>'+card('出荷履歴',ordersTable(result));}
function inventoryView(){
 const m=C.metrics(db),search=filters.search.toLowerCase(),units=db.units.filter(u=>(u.name+' '+u.code+' '+u.components.map(c=>C.lookup(db,'skus',c.skuId).code).join(' ')).toLowerCase().includes(search));
 const rows=units.map(u=>{
  const stats=u.components.map(c=>{const s=C.lookup(db,'skus',c.skuId),v=C.skuValue(db,s.id);return '<tr><td><span class="item-name">'+esc(skuName(s))+'</span><div class="item-code">'+esc(s.code)+'</div></td><td class="num">'+c.qty+'</td><td class="num"><b>'+count(v.qty)+'</b></td><td class="num">'+count(v.pending)+'</td><td class="num">'+(v.qty?yen(v.value/v.qty):'—')+'</td><td>'+btn('ロット明細','stock-detail',s.id,'small')+'</td></tr>';});
  const available=C.unitAvailable(db,u),cost=C.estimateUnit(db,u.id);
  return '<details class="stock-unit" id="stock-'+esc(u.id)+'"><summary>'+thumbnail(u,true)+'<span class="stock-unit-name"><b>'+esc(u.name)+'</b><small>'+esc(u.code)+' · '+(u.single?'単品':u.components.reduce((n,c)=>n+c.qty,0)+'点セット')+'</small></span><span class="stock-unit-meta"><small>販売可能</small><strong>'+count(available)+'<small>'+(u.single?'個':'セット')+'</small></strong></span>'+tag(cost.provisional?'仮原価を含む':'原価確定',cost.provisional?'amber':'green')+'<span class="disclosure-arrow">⌄</span></summary><div class="stock-sku-content">'+table(['構成SKU','#1販売単位あたり','#在庫数','#未到着','#平均原価／点',''],stats)+'</div></details>';
 });
 return head('在庫管理','販売単位を開くと、構成SKUごとの在庫を確認できます。')+kpis([['在庫数量',count(m.stock)+'点','到着済み・未出荷'],['在庫評価額',yen(m.inventory),'後日費用を含む現在の原価'],['未到着',count(m.pending)+'点','輸入便に割当済み'],['販売単位',db.units.length+'種類','単品・同一SKUセット・混合セット']])+'<div class="filter-bar">'+input('stockSearch',filters.search,'search','class="search" placeholder="商品名・販売コード・SKUを検索" aria-label="商品名・販売コード・SKUを検索"')+'</div><section class="card"><div class="card-head"><h2>販売単位別の在庫</h2><span class="muted">画像を押すと登録・変更できます</span></div>'+(rows.length?rows.join(''):empty('該当する販売単位がありません'))+'</section><div class="notice info">単品とセットは同じSKU在庫を共有します。販売可能数は合算できません。画像は販売単位ごとに登録できます。</div>';
}
function catalogView(){return head('商品・セット','商品 → SKU → 販売単位。セットは出荷時に組み合わせます。',btn('＋ セットを登録','new-unit')+btn('＋ 商品・SKUを登録','new-sku','','primary'))+card('商品・SKUマスタ',db.skus.length?table(['商品','SKUコード','バリエーション','#売上配分基準額','標準送料',''],db.skus.map(s=>'<tr><td class="item-name">'+esc(C.lookup(db,'products',s.productId)?.name)+'</td><td>'+esc(s.code)+'</td><td>'+esc(s.label)+'</td><td class="num">'+yen(s.referencePrice)+'</td><td>'+esc(C.lookup(db,'shippings',s.shippingId)?.name||'未設定')+'</td><td>'+btn('編集','edit-sku',s.id,'small')+'</td></tr>')):empty('商品・SKUを登録しましょう','例：商品「Tシャツ」、SKU「赤・M」'))+card('セット販売単位',db.units.some(u=>!u.single)?table(['販売コード','セット名','構成','#標準発送件数',''],db.units.filter(u=>!u.single).map(u=>'<tr><td>'+esc(u.code)+'</td><td class="item-name">'+esc(u.name)+'</td><td class="text-wrap">'+esc(u.components.map(c=>C.lookup(db,'skus',c.skuId).code+' ×'+c.qty).join(' ＋ '))+'</td><td class="num">'+u.parcels+'</td><td>'+btn('編集','edit-unit',u.id,'small')+'</td></tr>')):empty('セットはまだありません','同じSKUの複数個・異なるSKUの組み合わせに対応します。'))+'<div class="notice info">売上配分基準額は、混合セットの売上・手数料・送料を構成SKUに分けるための金額です。単品通常価格を目安に設定してください。仕入共通費は実際の商品代金比率で配分します。</div>';}
function pricesView(){if(!db.channels.length||!db.units.length)return head('販売価格マスタ','販路ごとの通常価格・セール価格・送料を設定します。')+empty('先に商品・SKUと販路を登録してください');const ch=filters.priceChannel||db.channels[0].id;return head('販売価格マスタ','通常価格・セール価格・送料を、販売単位ごとに登録します。',btn('変更を保存','save-prices','','primary'))+'<div class="filter-bar">'+field('販路',select('priceChannel',db.channels,ch))+'</div><form id="priceForm">'+card('販売価格一覧',table(['販売単位','#通常価格','#セール価格','送料パターン'],db.units.map(u=>{const p=C.priceOf(db,u.id,ch),s=C.lookup(db,'skus',u.components[0].skuId);return '<tr data-price-unit="'+esc(u.id)+'"><td class="text-wrap"><span class="item-name">'+esc(u.name)+'</span><div class="item-code">'+esc(u.code)+'</div></td><td class="num">'+input('normal',p.normal,'number','min="0" step="1" class="price-input" aria-label="'+esc(u.code)+' 通常価格"')+'</td><td class="num">'+input('sale',p.sale,'number','min="0" step="1" class="price-input" aria-label="'+esc(u.code)+' セール価格"')+'</td><td>'+select('shipping',db.shippings,p.shippingId||s?.shippingId||'',x=>x.name+' / '+yen(x.cost),'選択')+'</td></tr>';})))+'</form><div class="notice info">ここで変更しても、登録済みの売上・販売価格・送料は変わりません。</div>';}
function analysisView(){const m=C.metrics(db,filters),rows=C.ranking(db,filters);return head('売上分析','出荷日基準で、商品・SKU・販売単位の実績を比較します。',btn('分析CSVを書き出す','export-analysis'))+'<div class="filter-bar">'+field('集計月',input('anMonth',filters.month,'month'))+field('販路',select('anChannel',db.channels,filters.channelId,x=>x.name,'すべて'))+field('集計単位','<select name="anAxis">'+[['product','商品別'],['sku','SKU別'],['unit','販売単位別（単品・セット）']].map(([v,l])=>'<option value="'+v+'"'+(filters.axis===v?' selected':'')+'>'+l+'</option>').join('')+'</select>')+field('並び順','<select name="anSort">'+[['revenue','売上額'],['qty','販売数'],['profit','販売利益']].map(([v,l])=>'<option value="'+v+'"'+(filters.sort===v?' selected':'')+'>'+l+'</option>').join('')+'</select>')+'</div>'+kpis([['売上',yen(m.revenue),'取消済みを除外'],['販売利益',yen(m.profit),m.provisional+'件は原価未確定'],['仕入原価',yen(m.cogs),'後日費用の訂正も反映'],['手数料・発送送料',yen(m.fee+m.shipping),'販売時の金額で集計']])+card('月別ランキング',rankTable(rows),tag(filters.axis==='unit'?'販売個数・セット数':'構成SKUの販売点数'))+card('月別の推移',table(['月','#売上','#販売数','#仕入原価','#販売利益'],monthSeries().map(r=>'<tr><td>'+r.month+'</td><td class="num">'+yen(r.revenue)+'</td><td class="num">'+r.qty+'</td><td class="num">'+yen(r.cogs)+'</td><td class="num">'+yen(r.profit)+'</td></tr>')))+'<div class="notice info">商品・SKU別ではセットの売上を販売時の基準額比率で配分します。商品別と販売単位別は同じ実績の別表示であり、合算しません。後日費用を反映すると、販売した月の利益も更新されます。</div>';}
function settingsView(){
 const channels=db.channels.map(c=>'<div class="setting-item"><span>'+esc(c.name)+'<small>手数料 '+c.rate+'%'+(c.fixed?' ＋ '+yen(c.fixed)+'/取引':'')+'</small></span><div class="actions">'+btn('編集','edit-channel',c.id,'small')+btn('削除','delete-channel',c.id,'ghost small')+'</div></div>').join('');

 const sections=[

function openPurchase(){C.assert(db.skus.length,'先に商品・SKUを登録してください');showModal('仕入れを登録','<div class="form-grid">'+field('仕入日',input('date',C.today(),'date','required'))+field('メモ・仕入先',input('memo','','text','placeholder="例：中国仕入れ 第3回"'))+'</div><div id="buyRows">'+purchaseRow()+'</div>'+btn('＋ SKUを追加','add-buy-row','','small')+'<div class="block-title">仕入れ全体の共通費</div><div id="expenseRows">'+expenseRows()+'</div>'+btn('＋ 費用を追加','add-fee-row','','small')+'<label class="check-label">'+input('autoImport','yes','checkbox','checked')+'輸入便を自動作成する（通常はこちら）</label><label class="check-label">'+input('arrived','yes','checkbox')+'今回の数量は全数到着済み</label><div class="help-inline">複数便に分ける場合は自動作成を外し、輸入便画面で対象数量を割り当ててください。</div><div id="buyCalc" class="calc"></div>',form=>{const fd=new FormData(form),lines=$$('#buyRows .row-edit').map(r=>({skuId:r.querySelector('[name=buySku]').value,qty:Number(r.querySelector('[name=buyQty]').value),price:Number(r.querySelector('[name=buyPrice]').value)})),expenses=$$('#expenseRows .expense-row').map(r=>({name:r.querySelector('[name=expenseName]').value,amount:Number(r.querySelector('[name=expenseAmount]').value)}));C.assert(!fd.has('arrived')||fd.has('autoImport'),'到着済み登録には輸入便の自動作成を選んでください');change('仕入れを登録',d=>{const p=C.addPurchase(d,{date:fd.get('date'),memo:fd.get('memo'),lines,expenses,autoImport:fd.has('autoImport')});if(fd.has('arrived'))for(const a of d.imports.at(-1).allocations)C.addArrival(d,{lotId:a.id,qty:a.qty,date:p.date});});closeModal();toast('仕入れを登録しました');});updateBuyCalc();}
function updateBuyCalc(){if(!$('#buyCalc'))return;let goods=0,extra=0;$$('#buyRows .row-edit').forEach(r=>goods+=Number(r.querySelector('[name=buyQty]').value)*Number(r.querySelector('[name=buyPrice]').value));$$('#expenseRows .expense-row').forEach(r=>extra+=Number(r.querySelector('[name=expenseAmount]').value));$('#buyCalc').innerHTML='<strong>仕入総額 '+yen(goods+extra)+'</strong>商品代 '+yen(goods)+' ＋ 共通費 '+yen(extra);}
function openSku(skuId=''){const s=C.lookup(db,'skus',skuId);showModal(s?'SKUを編集':'商品・SKUを登録','<div class="form-grid">'+field('商品名',input('productName',s?C.lookup(db,'products',s.productId).name:'','text','required list="productNames"'))+field('SKUコード',input('code',s?.code||'','text','required placeholder="例：TS-RED-M"'))+field('バリエーション',input('label',s?.label||'','text','placeholder="例：赤 / M"'))+field('売上配分基準額（円）',input('referencePrice',s?.referencePrice||0,'number','min="0" step="1" required'))+field('標準送料パターン',select('shippingId',db.shippings,s?.shippingId||'',x=>x.name+' / '+yen(x.cost),'未設定'))+'</div><datalist id="productNames">'+db.products.map(p=>'<option value="'+esc(p.name)+'">').join('')+'</datalist><div class="notice info">同じ商品名でSKUを追加すると、同じ商品の色・サイズ違いとしてまとまります。基準額は混合セットの売上配分に使います。</div>',form=>{const fd=new FormData(form),values={productName:fd.get('productName'),code:fd.get('code'),label:fd.get('label'),referencePrice:Number(fd.get('referencePrice')),shippingId:fd.get('shippingId')};change(s?'SKUを編集':'商品・SKUを登録',d=>{if(!s){C.addSku(d,values);return;}const x=C.lookup(d,'skus',s.id);C.assert(!d.skus.some(y=>y.id!==s.id&&y.code.toLowerCase()===values.code.trim().toLowerCase()),'SKUコードが重複しています');C.assert(!d.units.some(u=>!u.single&&u.code.toLowerCase()===values.code.trim().toLowerCase()),'セットの販売コードと重複しています');let p=d.products.find(p=>p.name===values.productName.trim());if(!p){p={id:C.id('p'),name:values.productName.trim()};d.products.push(p);}Object.assign(x,{productId:p.id,code:values.code.trim(),label:values.label.trim(),referencePrice:values.referencePrice,shippingId:values.shippingId});for(const u of d.units.filter(u=>u.single&&u.components[0].skuId===s.id)){u.code=x.code;u.name=p.name+(x.label?' / '+x.label:'');}});closeModal();toast('保存しました');});}
function componentRow(c={}){return '<div class="component-row"><div><label>構成SKU</label>'+select('componentSku',db.skus,c.skuId||'',s=>s.code+' / '+skuName(s))+'</div><div><label>1セットあたり数量</label>'+input('componentQty',c.qty||1,'number','min="1" step="1" required')+'</div><button type="button" class="icon-btn" data-act="remove-row" aria-label="構成行を削除">×</button></div>';}
function openUnit(unitId=''){C.assert(db.skus.length,'先にSKUを登録してください');const u=C.lookup(db,'units',unitId);showModal(u?'セットを編集':'セット販売単位を登録','<div class="form-grid">'+field('販売コード',input('code',u?.code||'','text','required placeholder="例：SET-001"'))+field('セット名',input('name',u?.name||'','text','required'))+field('1セットあたり標準発送件数',input('parcels',u?.parcels||1,'number','min="1" step="1" required'))+'</div><div class="block-title">セットの構成</div><div id="componentRows">'+(u?u.components.map(componentRow).join(''):componentRow())+'</div>'+btn('＋ 構成SKUを追加','add-component','','small')+'<div class="notice info gap-top">セット専用の在庫は持ちません。出荷時に構成SKUの在庫を消費します。構成を変更しても過去の出荷は変わりません。</div>',form=>{const fd=new FormData(form),v={code:fd.get('code'),name:fd.get('name'),parcels:Number(fd.get('parcels')),components:$$('#componentRows .component-row').map(r=>({skuId:r.querySelector('[name=componentSku]').value,qty:Number(r.querySelector('[name=componentQty]').value)}))};change(u?'セットを編集':'セットを登録',d=>{if(u){const old=C.lookup(d,'units',u.id),savedId=old.id;d.units=d.units.filter(x=>x.id!==old.id);const n=C.addUnit(d,v);n.id=savedId;n.image=old.image||'';}else C.addUnit(d,v);});closeModal();toast('セットを保存しました');});}
function openChannel(id=''){const c=C.lookup(db,'channels',id);showModal('販路と手数料','<div class="form-grid">'+field('販路名',input('name',c?.name||'','text','required'))+field('手数料率（%）',input('rate',c?.rate??0,'number','min="0" max="100" step="0.01" required'))+field('取引ごとの固定手数料（円）',input('fixed',c?.fixed||0,'number','min="0" step="1" required'))+'</div><div class="help-inline">初期値0を実際の条件に合わせて設定してください。登録済みの販売実績は変更しません。</div>',form=>{const fd=new FormData(form);change('販路を設定',d=>{C.assert(!d.channels.some(x=>x.id!==id&&x.name===fd.get('name').trim()),'販路名が重複しています');const v={id:id||C.id('ch'),name:fd.get('name').trim(),rate:Number(fd.get('rate')),fixed:Number(fd.get('fixed'))};if(c)Object.assign(C.lookup(d,'channels',id),v);else d.channels.push(v);});closeModal();toast('販路を保存しました');});}
function openShipping(id=''){const s=C.lookup(db,'shippings',id);showModal('送料パターン','<div class="form-grid">'+field('パターン名',input('name',s?.name||'','text','required placeholder="例：小型便"'))+field('発送方法',input('method',s?.method||'','text','required placeholder="例：ポスト投函"'))+field('1件あたり送料（円）',input('cost',s?.cost||0,'number','min="0" step="1" required'))+'</div>',form=>{const fd=new FormData(form);change('送料パターンを設定',d=>{C.assert(!d.shippings.some(x=>x.id!==id&&x.name===fd.get('name').trim()),'パターン名が重複しています');const v={id:id||C.id('ship'),name:fd.get('name').trim(),method:fd.get('method').trim(),cost:Number(fd.get('cost'))};if(s)Object.assign(C.lookup(d,'shippings',id),v);else d.shippings.push(v);});closeModal();toast('送料パターンを保存しました');});}
function orderRow(unitId=''){const unit=C.lookup(db,'units',unitId)||db.units[0],ch=$('[name=channelId]')?.value||db.channels[0]?.id,p=C.priceOf(db,unit?.id,ch),sku=unit&&C.lookup(db,'skus',unit.components[0].skuId);return '<div class="order-row"><div class="order-top"><div>'+select('orderUnit',db.units,unit?.id,u=>u.name+'［'+u.code+'］')+'</div><button type="button" data-act="remove-row" class="icon-btn" aria-label="出荷行を削除">×</button></div><div class="order-fields"><div><label>販売数</label>'+input('orderQty',1,'number','min="1" step="1" required')+'</div><div><label>価格区分</label><select name="priceType"><option value="normal">通常</option><option value="sale">セール</option><option value="custom">実売価格</option></select></div><div><label>単価（円）</label>'+input('orderPrice',p.normal,'number','min="0" step="1" required')+'</div><div><label>送料パターン</label>'+select('orderShipping',db.shippings,p.shippingId||sku?.shippingId||'',s=>s.name+' / '+yen(s.cost),'選択')+'</div><div><label>発送件数</label>'+input('orderParcels',unit?.parcels||1,'number','min="1" step="1" required')+'</div></div></div>';}
function openOrder(){C.assert(db.units.length&&db.channels.length&&db.shippings.length,'商品・SKU、販路、送料パターンを先に登録してください');showModal('出荷を登録','<div class="form-grid three">'+field('出荷日',input('date',C.today(),'date','required'))+field('販路',select('channelId',db.channels,db.channels[0].id))+field('発送区分','<select name="shipMode"><option value="separate">個別発送（通常）</option><option value="shared">同梱発送</option></select>')+'</div><div id="orderRows">'+orderRow()+'</div>'+btn('＋ 販売単位を追加','add-order-row','','small')+'<div id="sharedFields" class="form-grid gap-top hidden">'+field('同梱の送料パターン',select('sharedShipping',db.shippings,db.shippings[0].id,s=>s.name+' / '+yen(s.cost)))+field('梱包数',input('sharedParcels',1,'number','min="1" step="1"'))+'</div><details class="gap-top"><summary class="muted">実際の送料・手数料を指定する場合</summary><div class="form-grid gap-top">'+field('実送料合計（空欄は自動計算）',input('shippingOverride','','number','min="0" step="1"'))+field('実手数料合計（空欄は自動計算）',input('feeOverride','','number','min="0" step="1"'))+'</div></details><div class="gap-top">'+field('LINE依頼文の補足',input('memo','','text','placeholder="任意"'))+'</div><div id="orderCalc" class="calc"></div><div class="help-inline">出荷依頼でLINEを開きます。送信先の選択・送信はLINEで行ってください。</div>',form=>{const order=change('出荷を登録',d=>C.makeOrder(d,readOrderForm(form)));const opened=openLine(C.lineMessage(db,order));closeModal();showOrder(order.id);toast(opened?'出荷を登録し、LINE画面を開きました。送信はLINEで行ってください':'出荷を登録しました。LINEが開かない場合は依頼文をコピーしてください');},'出荷依頼（登録してLINEを開く）');updateOrderCalc();}
function readOrderForm(form){const fd=new FormData(form),v={date:fd.get('date'),channelId:fd.get('channelId'),mode:fd.get('shipMode'),shippingId:fd.get('sharedShipping'),parcels:Number(fd.get('sharedParcels')),memo:fd.get('memo'),lines:$$('#orderRows .order-row').map(r=>({unitId:r.querySelector('[name=orderUnit]').value,qty:Number(r.querySelector('[name=orderQty]').value),price:Number(r.querySelector('[name=orderPrice]').value),priceType:r.querySelector('[name=priceType]').value,shippingId:r.querySelector('[name=orderShipping]').value,parcels:Number(r.querySelector('[name=orderParcels]').value)}))};for(const k of ['shippingOverride','feeOverride'])if(fd.get(k)!=='')v[k]=Number(fd.get(k));return v;}
function updateOrderCalc(){if(!$('#orderCalc'))return;const form=$('#modalForm'),shared=form.querySelector('[name=shipMode]').value==='shared';$('#sharedFields').classList.toggle('hidden',!shared);$$('#orderRows [name=orderShipping],#orderRows [name=orderParcels]').forEach(x=>x.disabled=shared);try{const d=C.clone(db),o=C.makeOrder(d,readOrderForm(form)),r=C.orderResult(d,o);$('#orderCalc').innerHTML='<strong>販売利益 '+yen(r.profit)+'</strong><br>売上 '+yen(r.revenue)+' − 原価 '+yen(r.cogs)+' − 手数料 '+yen(r.fee)+' − 送料 '+yen(r.shipping)+(r.provisional?'<br>原価未確定の仕入れを含むため、利益は暫定です。':'');$('#orderCalc').classList.remove('danger');}catch(e){$('#orderCalc').textContent=e.message;$('#orderCalc').classList.add('danger');}}
function updateOrderRow(row,resetPrice=true){const u=C.lookup(db,'units',row.querySelector('[name=orderUnit]').value),ch=$('[name=channelId]').value,p=C.priceOf(db,u.id,ch),type=row.querySelector('[name=priceType]').value,s=C.lookup(db,'skus',u.components[0].skuId);if(resetPrice&&type!=='custom')row.querySelector('[name=orderPrice]').value=type==='sale'?p.sale:p.normal;row.querySelector('[name=orderShipping]').value=p.shippingId||s?.shippingId||'';row.querySelector('[name=orderParcels]').value=Number(row.querySelector('[name=orderQty]').value)*(u.parcels||1);}

function jsonp(action,extra={}){return new Promise((resolve,reject)=>{const callback='akane_cb_'+C.id().replace(/[^a-zA-Z0-9_]/g,''),script=document.createElement('script'),url=new URL(config.url),timer=setTimeout(()=>done(Error('応答がありません。URLと共有キー、公開設定を確認してください')),12000);function done(err,value){clearTimeout(timer);delete window[callback];script.remove();err?reject(err):resolve(value);}window[callback]=r=>done(null,r);url.searchParams.set('action',action);url.searchParams.set('callback',callback);url.searchParams.set('secret',config.secret);url.searchParams.set('t',Date.now());for(const [k,v] of Object.entries(extra))url.searchParams.set(k,v);script.onerror=()=>done(Error('クラウドに接続できません'));script.src=url.href;document.body.append(script);});}
function scheduleSync(){clearTimeout(syncTimer);if(mode==='real'&&config.url&&!conflict)syncTimer=setTimeout(()=>pushCloud().catch(e=>{toast(e.message);renderBanner();}),1200);}
async function pullCloud(explicit=false){
 C.assert(mode==='real'&&config.url,'実データモードで共有設定を保存してください');if(saving||pulling)return;
 pulling=true;const startedSeq=seq,sourceUrl=config.url;
 try{const r=await jsonp('load');if(mode!=='real'||config.url!==sourceUrl)return;C.assert(r.ok,r.error||'読込に失敗しました');if(!r.data){if(explicit)toast('クラウドは空です。「この端末の内容を送信」で開始してください');return;}C.validate(r.data);if(r.rev===config.rev){if(explicit)toast(config.dirty?'手元に未送信の変更があります。端末の内容を送信してください':'すでに最新です');return;}
 if(seq!==startedSeq||(config.dirty&&!explicit)){conflict=true;renderBanner();return;}
 if(explicit&&(db.skus.length||db.purchases.length||db.orders.length)){if(!confirm('手元の内容をバックアップしてから、クラウドの内容に置き換えます。よろしいですか？'))return;backup();}
 persist(r.data,'クラウドから読込',false);config.rev=r.rev;config.dirty=false;conflict=false;cloudConfig();renderBanner();if(explicit)toast('クラウドから読み込みました');
 }finally{pulling=false;}
}
async function pushCloud(explicit=false){C.assert(mode==='real'&&config.url,'実データモードで共有設定を保存してください');if(saving||pulling||(!config.dirty&&!explicit)||conflict)return;if(explicit){const remote=await jsonp('load');C.assert(remote.ok,remote.error||'接続できません');if(remote.rev!==config.rev&&remote.data){conflict=true;renderBanner();throw Error('別端末の更新があります。バックアップ後にクラウドから読み込んでください');}if(!remote.data)config.rev=remote.rev||0;}saving=true;const startedSeq=seq,rid=C.id('request'),baseRev=config.rev,payload=JSON.stringify(db);try{C.assert(new TextEncoder().encode(payload).length<=2000000,'保存データが2MBを超えています。JSONバックアップを保存してください');await fetch(config.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({action:'save',secret:config.secret,requestId:rid,baseRev:String(baseRev),data:payload})});let result;for(let i=0;i<10;i++){await new Promise(r=>setTimeout(r,900));result=await jsonp('status',{requestId:rid});if(result.pending)continue;break;}C.assert(result&&!result.pending,'保存確認が完了していません。未同期の内容は端末に保持されています');if(result.conflict){conflict=true;throw Error('他端末と競合しました。手元の変更は保持しています');}C.assert(result.ok,result.error||'保存が拒否されました');config.rev=result.rev;config.dirty=seq!==startedSeq;cloudConfig();if(explicit)toast('クラウドへの保存を確認しました');}finally{saving=false;renderBanner();if(config.dirty&&!conflict&&seq!==startedSeq)scheduleSync();}}
function cloudHelp(){showModal('クラウド共有の設定手順','<ol class="help-list"><li>配布フォルダの「Code.gs」をGoogle Apps Scriptの新規プロジェクトへ貼り付けます。</li><li>スクリプトプロパティに「AKANE_SECRET」を登録し、長いランダムな共有キーを設定します。</li><li>ウェブアプリとして新しいデプロイを作成。「実行するユーザー：自分」「アクセスできるユーザー：全員」で公開します。必要な権限は自分のアカウントで承認します。</li><li>新しい /exec URLと共有キーを実データモードの設定欄へ入力します。</li><li>初回はPC側から「この端末の内容を送信」。スマホ側には同じアプリ・URL・共有キーを設定して「クラウドから読込」を選びます。</li></ol><div class="notice">実際のGAS接続・PCとスマホの同期は未検証です。アプリを両端末から開けるHTTPSの公開先も必要です。既存デオドラントアプリのGASは変更しません。</div><div class="help-inline">サーバーは版番号・保存要求IDで受理を確認し、同時書込をロックします。復元用の直近20版は専用Driveフォルダに残します。</div>',null);}
async function action(act,id,el){switch(act){case'nav':if(priceDirty&&!confirm('価格の変更が未保存です。移動しますか？'))return;priceDirty=false;page=id;filters.search='';render();window.scrollTo(0,0);break;case'close':closeModal();break;case'subtab':{if(priceDirty&&!confirm('価格の変更が未保存です。切り替えますか？'))return;priceDirty=false;const [key,value]=id.split('|');filters[key]=value;render();break;}case'settings-jump':{const section=document.getElementById('settings-'+id);if(section){section.open=true;section.scrollIntoView({behavior:'smooth',block:'start'});section.querySelector('summary').focus({preventScroll:true});}break;}case'unit-image':imageEditor(id);break;case'choose-unit-image':$('#unitImageFile').click();break;case'clear-unit-image':imageDraft='';$('[name=imageUrl]').value='';$('#imagePreview').innerHTML=thumbnail({name:'画像未設定'});break;case'reload':location.reload();break;case'go-settings':page='settings';render();break;case'go-analysis':page='analysis';render();break;case'go-orders':page='orders';render();break;case'new-purchase':openPurchase();break;case'purchase-detail':showPurchase(id);break;case'new-sku':openSku();break;case'edit-sku':openSku(id);break;case'new-unit':openUnit();break;case'edit-unit':openUnit(id);break;case'new-channel':openChannel();break;case'edit-channel':openChannel(id);break;case'new-shipping':openShipping();break;case'edit-shipping':openShipping(id);break;case'delete-channel':C.assert(!db.orders.some(o=>o.channelId===id)&&!Object.keys(db.prices).some(k=>k.endsWith('|'+id)),'販売履歴または価格設定で使用中の販路は削除できません');if(confirm('販路を削除しますか？'))change('販路を削除',d=>d.channels=d.channels.filter(c=>c.id!==id));break;case'delete-shipping':C.assert(!db.skus.some(s=>s.shippingId===id)&&!Object.values(db.prices).some(p=>p.shippingId===id),'SKUまたは価格設定で使用中の送料は削除できません');if(confirm('送料パターンを削除しますか？'))change('送料を削除',d=>d.shippings=d.shippings.filter(s=>s.id!==id));break;case'add-buy-row':$('#buyRows').insertAdjacentHTML('beforeend',purchaseRow());updateBuyCalc();break;case'add-fee-row':$('#expenseRows').insertAdjacentHTML('beforeend',expenseRows([{name:'その他共通費',amount:0}]));updateBuyCalc();break;case'add-component':$('#componentRows').insertAdjacentHTML('beforeend',componentRow());break;case'remove-row':el.closest('.row-edit,.expense-row,.component-row,.order-row').remove();updateBuyCalc();updateOrderCalc();break;case'new-order':openOrder();break;case'add-order-row':$('#orderRows').insertAdjacentHTML('beforeend',orderRow());updateOrderCalc();break;case'quick-order':openQuickOrder();break;case'order-detail':showOrder(id);break;case'cancel-order':if(confirm('出荷を取り消し、消費したロットへ在庫を戻します。売上・利益の集計から除外しますか？')){change('出荷を取消',d=>{C.lookup(d,'orders',id).cancelled=true;});closeModal();toast('出荷を取り消しました');}break;case'copy-line':await copyMessage();break;case'open-line':if(!openLine(lastMessage))toast('LINE画面を開けませんでした。依頼文をコピーしてください');break;case'add-expense':openExpense(id);break;case'remove-expense':{const [bid,fid]=id.split('|'),b=C.lookup(db,'imports',bid);C.assert(!b.finalized,'確定済みの費用を削除するには先に確定を解除してください');if(confirm('共通費を削除し、在庫評価額・販売済み利益を再計算しますか？'))change('共通費を削除',d=>{const x=C.lookup(d,'imports',bid);x.expenses=x.expenses.filter(f=>f.id!==fid);});break;}case'finalize':{const b=C.lookup(db,'imports',id);if(confirm(b.finalized?'原価を未確定に戻しますか？':'すべての費用が揃いましたか？ この便の原価を確定します。'))change('原価の確定状態を変更',d=>C.lookup(d,'imports',id).finalized=!b.finalized);break;}case'arrive':openArrival(id);break;case'new-import':openNewImport();break;case'merge-imports':openMerge();break;case'stock-detail':showStock(id);break;case'save-prices':{change('販売価格を保存',d=>{$$('[data-price-unit]').forEach(r=>{d.prices[C.priceKey(r.dataset.priceUnit,r.dataset.priceChannel)]={normal:C.num(Number(r.querySelector('[name=normal]').value),'通常価格'),sale:C.num(Number(r.querySelector('[name=sale]').value),'セール価格'),shippingId:r.querySelector('[name=shipping]').value};});});priceDirty=false;toast('販路ごとの通常価格・セール価格を保存しました');break;}case'export-analysis':{const rows=C.ranking(db,filters);download('Artery_分析_'+(filters.month||'全期間')+'.csv',csvOut([['名称','販売数','売上','原価','手数料','送料','販売利益'],...rows.map(r=>[r.name,r.qty,r.revenue,r.cogs,r.fee,r.shipping,r.profit])]),'text/csv;charset=utf-8');break;}case'export-json':backup();break;case'restore-json':$('#jsonFile').click();break;case'import-csv':openCsv();break;case'csv-template':{const type=$('[name=csvType]').value;download('Artery_'+type+'_雛形.csv',csvOut(templates[type]),'text/csv;charset=utf-8');break;}case'csv-file':$('#csvFile').click();break;case'reset-demo':C.assert(mode==='demo','実データはここから初期化できません');if(confirm('サンプルだけを初期状態に戻しますか？')){persist(C.demo(),'サンプルをリセット',false);toast('サンプルを初期状態に戻しました');}break;case'cloud-help':cloudHelp();break;case'cloud-connect':{C.assert(!saving&&!pulling,'同期の確認中です。完了後に設定してください');C.assert(mode==='real','実データモードに切り替えてください');const fd=new FormData($('#cloudForm')),url=fd.get('cloudUrl').trim(),secret=fd.get('cloudSecret').trim();C.assert(/^https:\/\/script\.google\.com\/macros\/s\/[-\w]+\/exec$/.test(url),'専用GASの /exec URLを入力してください');C.assert(secret.length>=16,'共有キーは16文字以上にしてください');if(config.url!==url||config.secret!==secret){config={url,secret,rev:0,dirty:db.skus.length>0||db.orders.length>0||db.purchases.length>0};cloudConfig();}conflict=false;const r=await jsonp('load');C.assert(r.ok,r.error||'接続できません');toast(r.data?'接続できました。「クラウドから読込」で内容を確認してください':'接続できました。初回は端末の内容を送信してください');render();break;}case'cloud-load':await pullCloud(true);break;case'cloud-push':if(conflict)throw Error('競合中です。手元をバックアップ後、クラウドから読み込んでください');await pushCloud(true);break;case'cloud-disconnect':C.assert(!saving&&!pulling,'同期の確認中です。完了後に解除してください');if(confirm('クラウド同期を解除しますか？端末のデータは残ります。')){config={url:'',secret:'',rev:0,dirty:false};cloudConfig();conflict=false;render();}break;default:break;}}
function purchases(){
 const tab=filters.purchaseSection||'history',content=tab==='imports'?importsView():purchaseHistoryView();
 const actions=tab==='imports'?btn('便をまとめる','merge-imports')+btn('＋ 輸入便を作成','new-import','','primary'):btn('＋ 仕入れを登録','new-purchase','','primary');
 return head('仕入れ管理','仕入れから、輸入便・後日共通費までまとめて管理します。',actions)+subtabs('purchaseSection',[['history','仕入れ履歴'],['imports','輸入便・共通費']],tab)+viewBody(content);
}
function salesView(){
 const tab=filters.salesSection||'prices',catalog=tab==='catalog';
 const actions=catalog?btn('＋ セットを登録','new-unit')+btn('＋ 商品・SKUを登録','new-sku','','primary'):btn('価格を保存','save-prices','','primary');
 return head('販売管理','商品・SKU・セットと、販路ごとの通常価格・セール価格を管理します。',actions)+subtabs('salesSection',[['prices','価格・利益'],['catalog','商品・SKU・セット']],tab)+(catalog?viewBody(catalogView()):salesPrices());
}
function viewBody(html){const at=html.indexOf('<section class="card">');return at<0?html:html.slice(at);}
function subtabs(key,items,current){return '<div class="section-tabs" role="tablist">'+items.map(([value,label])=>'<button type="button" data-act="subtab" data-id="'+key+'|'+value+'" role="tab" aria-selected="'+(current===value)+'" class="'+(current===value?'active':'')+'">'+label+'</button>').join('')+'</div>';}
function safeImage(value){return C.validImage(value)?value:'';}
function thumbnail(u,editable=false){const src=safeImage(u.image||''),body=src?'<img src="'+esc(src)+'" alt="'+esc(u.name)+'" loading="lazy" referrerpolicy="no-referrer">':'<span aria-hidden="true">▧</span>';return editable?'<button type="button" class="unit-thumb editable" data-act="unit-image" data-id="'+esc(u.id)+'" aria-label="'+esc(u.name)+'の画像を登録・変更">'+body+'</button>':'<span class="unit-thumb">'+body+'</span>';}
function marginMarkup(result){if(result.cost===null)return '<span class="margin-missing">原価未登録</span>';if(result.shipping===null)return '<span class="margin-missing">送料未設定</span>';if(!result.price)return '<span class="margin-missing">価格未登録</span>';return '<span class="price-profit '+(result.profit<0?'red-text':'green-text')+'">利益 '+yen(result.profit)+'<small>利益率 '+result.margin.toFixed(1)+'%</small></span>';}
function salesPrices(){
 if(!db.channels.length||!db.units.length)return empty('商品・SKUと販路を先に登録してください');
 const cards=db.units.map(u=>{
  const cost=C.estimateUnit(db,u.id),sku=C.lookup(db,'skus',u.components[0].skuId);
  const rows=db.channels.map(ch=>{const p=C.priceOf(db,u.id,ch.id),shipId=p.shippingId||(u.single?sku.shippingId:'')||'',normal=C.estimateProfit(db,u.id,ch.id,p.normal,shipId),sale=C.estimateProfit(db,u.id,ch.id,p.sale,shipId);
   return '<tr data-price-unit="'+esc(u.id)+'" data-price-channel="'+esc(ch.id)+'"><td class="item-name">'+esc(ch.name)+'</td><td><div class="price-entry">'+input('normal',p.normal,'number','min="0" step="1" class="price-input" aria-label="'+esc(u.code+' '+ch.name)+' 通常価格"')+'<span class="price-currency">円</span></div><div class="normal-margin">'+marginMarkup(normal)+'</div></td><td><div class="price-entry">'+input('sale',p.sale,'number','min="0" step="1" class="price-input" aria-label="'+esc(u.code+' '+ch.name)+' セール価格"')+'<span class="price-currency">円</span></div><div class="sale-margin">'+marginMarkup(sale)+'</div></td><td>'+select('shipping',db.shippings,shipId,x=>x.name+' / '+yen(x.cost),'選択')+'</td></tr>';
  });
  return '<section class="card price-unit"><div class="card-head"><div class="unit-heading">'+thumbnail(u)+'<div><h2>'+esc(u.name)+'</h2><div class="item-code">'+esc(u.code)+' · 原価目安 '+(cost.cost===null?'未登録':yen(cost.cost))+' / '+esc(cost.basis)+'</div></div></div>'+tag(u.single?'単品':'セット',u.single?'':'red')+'</div>'+table(['販路','通常価格・利益','セール価格・利益','送料パターン'],rows)+'</section>';
 });
 return '<div class="notice info">利益額＝販売価格 − 仕入原価 − 販路手数料 − 送料。利益率＝利益額 ÷ 販売価格。原価目安は現在庫の平均原価、在庫なしは最新の仕入原価です。実売の利益は先入先出で計算します。送料は1販売単位の標準発送件数を反映します。</div><form id="priceForm">'+cards.join('')+'</form>';
}
function refreshPriceMargins(){if(!$('#priceForm'))return;$('[data-price-unit]').forEach(row=>{const unitId=row.dataset.priceUnit,ch=row.dataset.priceChannel,ship=row.querySelector('[name=shipping]').value;for(const type of ['normal','sale']){const value=Number(row.querySelector('[name='+type+']').value);try{const estimate=C.estimateProfit(db,unitId,ch,value,ship);row.querySelector('.'+type+'-margin').innerHTML=marginMarkup(estimate);}catch(e){row.querySelector('.'+type+'-margin').textContent=e.message;}}});}
function openLine(text){const url='https://line.me/R/msg/text/?'+encodeURIComponent(text);try{const win=window.open(url,'_blank');if(win){try{win.opener=null;}catch(e){}return true;}return false;}catch(e){return false;}}
function imageEditor(unitId){const u=C.lookup(db,'units',unitId);C.assert(u,'販売単位が見つかりません');imageDraft=u.image||'';imageUnitId=unitId;showModal('販売単位の画像：'+u.name,'<div id="imagePreview" class="image-preview">'+thumbnail(u)+'</div><div class="actions">'+btn('画像ファイルを選ぶ','choose-unit-image')+btn('画像を外す','clear-unit-image')+'</div><div class="gap-top">'+field('画像URL（任意・https）',input('imageUrl',imageDraft.startsWith('https://')?imageDraft:'','url','placeholder="https://…"'))+'</div><div class="help-inline">ファイルは320px以内に縮小して保存します。画像はSKUではなく、この販売単位に紐付きます。</div>',form=>{const value=new FormData(form).get('imageUrl').trim()||imageDraft;C.assert(!value||C.validImage(value),'画像URLはhttps、画像ファイルはJPEG・PNG・WebPを指定してください');change('販売単位の画像を変更',d=>C.lookup(d,'units',unitId).image=value);closeModal();toast('画像を保存しました');});}
async function readUnitImage(file){C.assert(file&&file.size<=10000000,'10MB以下の画像を選んでください');C.assert(['image/jpeg','image/png','image/webp'].includes(file.type),'JPEG・PNG・WebPを選んでください');const selectedUnit=imageUnitId;const bitmap=await createImageBitmap(file);const ratio=Math.min(1,320/bitmap.width,320/bitmap.height),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*ratio));canvas.height=Math.max(1,Math.round(bitmap.height*ratio));const ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();const result=canvas.toDataURL('image/jpeg',.72);C.assert(C.validImage(result),'画像が大きすぎます。小さい画像を選んでください');if(!$('#modal').open||selectedUnit!==imageUnitId||!$('#imagePreview'))return;imageDraft=result;$('[name=imageUrl]').value='';$('#imagePreview').innerHTML=thumbnail({name:'登録画像',image:result});toast('画像を読み込みました。「保存する」で反映します');}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el){e.preventDefault();Promise.resolve(action(el.dataset.act,el.dataset.id||'',el)).catch(e=>toast(e.message));}});
$('#modalForm').addEventListener('submit',e=>{e.preventDefault();try{saveForm?.(e.target);}catch(e){toast(e.message);}});
document.addEventListener('change',e=>{const name=e.target.name;if(name==='orderMonth'){filters.month=e.target.value;render();}if(name==='anMonth'){filters.month=e.target.value;render();}if(name==='anChannel'){filters.channelId=e.target.value;render();}if(name==='anAxis'){filters.axis=e.target.value;render();}if(name==='anSort'){filters.sort=e.target.value;render();}if(name==='priceChannel'){filters.priceChannel=e.target.value;render();}if(e.target.closest('#orderRows')){const row=e.target.closest('.order-row');if(['orderUnit','priceType'].includes(name))updateOrderRow(row);if(name==='orderQty')row.querySelector('[name=orderParcels]').value=Number(e.target.value)*(C.lookup(db,'units',row.querySelector('[name=orderUnit]').value).parcels||1);if(name==='orderPrice')row.querySelector('[name=priceType]').value='custom';}if(name==='channelId')$$('#orderRows .order-row').forEach(r=>updateOrderRow(r));if(e.target.closest('#priceForm')){priceDirty=true;refreshPriceMargins();}updateBuyCalc();updateOrderCalc();updateExpenseImpact();});
document.addEventListener('input',e=>{if(e.target.name==='stockSearch'){const pos=e.target.selectionStart;filters.search=e.target.value;render();const x=$('[name=stockSearch]');x.focus();x.setSelectionRange(pos,pos);}updateBuyCalc();updateOrderCalc();updateExpenseImpact();});
$('#modeToggle').addEventListener('click',()=>{try{C.assert(!saving&&!pulling,'同期の確認中です。完了後に切り替えてください');closeModal();loadMode(mode==='demo'?'real':'demo');page='dashboard';render();toast(mode==='demo'?'サンプルモードです':'実データモードです。初回は商品・販路を設定してください');}catch(e){toast(e.message);}});
const unitImageFile=document.createElement('input');unitImageFile.type='file';unitImageFile.id='unitImageFile';unitImageFile.accept='image/jpeg,image/png,image/webp';unitImageFile.hidden=true;document.body.append(unitImageFile);unitImageFile.addEventListener('change',async e=>{try{if(e.target.files[0])await readUnitImage(e.target.files[0]);}catch(err){toast(err.message);}finally{e.target.value='';}});
$('#jsonFile').addEventListener('change',async e=>{try{const file=e.target.files[0];if(!file)return;C.assert(file.size<=10000000,'10MB以下のファイルを選んでください');const candidate=JSON.parse(await file.text());C.validate(candidate);showModal('バックアップから復元','<div class="notice">現在の'+(mode==='demo'?'サンプル':'実データ')+'を置き換えます。反映前に現在の内容をバックアップします。</div>'+table(['項目','復元するデータ'],[['SKU',candidate.skus.length],['仕入れ',candidate.purchases.length],['出荷',candidate.orders.length]].map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>')),()=>{backup();persist(C.clone(candidate),'JSONから復元');closeModal();toast('復元しました');},'バックアップして復元');}catch(err){toast(err.message);}finally{e.target.value='';}});
$('#csvFile').addEventListener('change',async e=>{try{const file=e.target.files[0];if(!file)return;C.assert(file.size<=5000000,'5MB以下のCSVを選んでください');const text=await file.text();C.assert(!text.includes('\uFFFD'),'文字コードはUTF-8で保存してください');$('[name=csvText]').value=text;toast('CSVを読み込みました。内容を検証してください');}catch(err){toast(err.message);}finally{e.target.value='';}});
window.addEventListener('storage',e=>{if(e.key===key+mode){localChanged=true;renderBanner();}});
setInterval(()=>{if(mode==='real'&&config.url&&!saving&&!conflict&&!$('#modal').open&&!localChanged&&!document.hidden&&!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))pullCloud().catch(()=>{});},15000);
try{loadMode(mode==='real'?'real':'demo');render();}catch(e){$('#view').innerHTML='<div class="notice danger">保存データを読み込めません。既存データは保持しています。 '+esc(e.message)+'</div>';$('#modeToggle').disabled=true;}
window.AkaneApp={get data(){return C.clone(db)},get mode(){return mode},get page(){return page}};
})();
</script></body></html>
